<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Gemiura">
  <title>Gemiura</title>
  <defs>
    <linearGradient id="gU" x1="8" y1="6" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B050"/>
